; ═══════════════════════════════════════════════════════════════
; Patternflow Ensemble - the hub
;
; A bare ESP32-S3-DevKitC-1 (the FlowLocal board of the 2026 exhibition
; works as it is). It carries the Wi-Fi the panels join, runs the conductor
; (../core/pfe_conductor.h) and talks to a laptop:
;
;   USB jack   a serial port named "Patternflow Ensemble": the console
;              (../console/index.html, Chrome or Edge) connects here
;   COM jack   flashing and the boot log, 115200 baud; the console can
;              connect here as well
;   Wi-Fi      http://192.168.66.1/ serves the same console to a phone
;
; The platform is the one the Patternflow panel firmware builds with
; (espressif32@7.0.1, Arduino core 2.0.17), so a computer that has built a
; panel has nothing more to download.
;
; Windows, repository under a path with non-ASCII characters: the linker
; cannot write there. Set PLATFORMIO_BUILD_DIR to a plain path first, as for
; the panel (PF_BUILD_DIR) and FlowLocal.
; ═══════════════════════════════════════════════════════════════
[platformio]
default_envs = hub

[env:hub]
platform  = espressif32@7.0.1
board     = esp32-s3-devkitc-1
framework = arduino

; ARDUINO_USB_MODE=0 gives the native USB jack to TinyUSB, where this
; firmware makes it a CDC serial port. CDC_ON_BOOT=0 keeps `Serial` on
; UART0, the COM jack, so the boot log and the flasher stay where they were.
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -std=gnu++11
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
  -std=gnu++17
  -Wall -Wextra -Wno-unused-parameter

lib_deps =
  esp32async/AsyncTCP @ 3.5.0
  esp32async/ESPAsyncWebServer @ 3.12.1

monitor_speed = 115200
upload_speed  = 921600
