; ═══════════════════════════════════════════════════════════════
; FlowLocal — ESP32-S3-DevKitC-1 N16R8
; flowlocal-sd  = SPI MicroSD CS=4 SCK=5 MOSI=6 MISO=7
; flowlocal     = USB-C stick on native USB jack (USB-OTG jumper closed)
; ═══════════════════════════════════════════════════════════════
[platformio]
default_envs = flowlocal
; Isolated from Patternflow — pioarduino must not overwrite ~/.platformio/platforms/espressif32.
platforms_dir = .pio-platforms
packages_dir = .pio-packages

[env:flowlocal]
platform   = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board      = esp32-s3-devkitc-1
framework  = arduino

board_build.flash_size     = 16MB
board_build.partitions     = partitions_16MB.csv
board_upload.flash_size    = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
extra_scripts = pre:tools/pio_filter_littlefs.py
; main_exhibit.cpp is env:exhibit's entry point; main.cpp is this one's.
build_src_filter =
  +<*>
  -<main_exhibit.cpp>

build_unflags =
  -DARDUINO_USB_MODE=1

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
  -std=gnu++17
  -Wall -Wextra -Wno-unused-parameter
  -I.pio-packages/framework-arduinoespressif32/libraries/HTTPClient/src
  -I.pio-packages/framework-arduinoespressif32/libraries/NetworkClientSecure/src

lib_deps =
  tanakamasayuki/EspUsbHost
  mlesniew/PicoMQTT
  mlesniew/PicoWebsocket
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
  bblanchon/ArduinoJson @ ^7.2.1
  adafruit/Adafruit GFX Library @ ^1.11.11
  adafruit/Adafruit BusIO @ ^1.16.1

monitor_speed = 115200
upload_speed  = 921600

; ── Exhibition 2026: Wi-Fi hotspot + RTP-MIDI → USB-MIDI dongle ─────────────
; One Patternflow panel invites this box (192.168.66.1:5004) over RTP-MIDI;
; every CC / Program Change / note it sends comes out of the DevKit's native
; USB jack (labelled USB) as a class-compliant MIDI device named
; "Patternflow Exhibit". The laptop running Live is on that jack and powers
; the board. Nothing else runs: no MQTT broker, no Director, no USB stick, no
; SD, no TFT, no weather, no upstream Wi-Fi. See EXHIBIT.md.
;
; ARDUINO_USB_MODE=0 hands the native USB PHY to TinyUSB (device); CDC stays
; off, so the device is MIDI-only (its USB product string and MIDI interface
; string are both "Patternflow Exhibit") and Serial is UART0 = the COM jack,
; which is also the flash port. The USB-OTG solder jumper stays OPEN: the
; laptop feeds VBUS on USB.
;
; Library versions are pinned exactly; AppleMIDI + MIDI Library match the
; panel (patternflow firmware/patternflow: lathoub/AppleMIDI ^3.5.0, which
; resolves 3.5.0 + FortySevenEffects MIDI Library 5.0.2). USBMIDI comes from
; the framework's own "USB" library (version = the core, 3.3.8), found through
; src/main_exhibit.cpp's includes.
;
; Windows + Korean project path: build with ASCII dirs, e.g.
;   PLATFORMIO_PLATFORMS_DIR=C:/Users/<you>/flx-pio/platforms
;   PLATFORMIO_PACKAGES_DIR=C:/Users/<you>/flx-pio/packages
;   PLATFORMIO_BUILD_DIR=C:/Users/<you>/flx-pio/build
; (environment variables win over platforms_dir / packages_dir above).
;
; No lib_ignore here on purpose: with lib_ignore set, pioarduino strips the
; matching IDF include paths (fatfs) from the SHARED framework build script
; and only puts them back after a successful link, so one failed exhibit build
; breaks env:flowlocal (EspUsbHost: diskio_impl.h not found).
[env:exhibit]
extends = env:flowlocal
; LittleFS / Director are not used by this build, so no data-dir filtering.
extra_scripts =
; Own entry point: main.cpp's includes would pull PicoMQTT / SD / SPI /
; LittleFS into the dependency graph. No HTTPClient link shim either.
build_src_filter =
  +<*>
  -<main.cpp>
  -<fl_http_link.cpp>
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
  -DFL_EXHIBIT=1
  -DFL_TFT_ENABLE=0
  -DFL_AP_MAX_CONN=3
  -std=gnu++17
  -Wall -Wextra -Wno-unused-parameter
lib_deps =
  esp32async/AsyncTCP @ 3.5.0
  esp32async/ESPAsyncWebServer @ 3.12.1
  bblanchon/ArduinoJson @ 7.4.3
  lathoub/AppleMIDI @ 3.5.0
  fortyseveneffects/MIDI Library @ 5.0.2

; SPI MicroSD alternate (no TFT — same pins). Proven working.
[env:flowlocal-sd]
extends = env:flowlocal
build_unflags =
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DFL_USE_SD=1
  -DFL_TFT_ENABLE=0
  -DCORE_DEBUG_LEVEL=1
  -std=gnu++17
  -Wall -Wextra -Wno-unused-parameter
lib_deps =
  mlesniew/PicoMQTT
  mlesniew/PicoWebsocket
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
  bblanchon/ArduinoJson @ ^7.2.1
